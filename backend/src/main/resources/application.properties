spring.application.name=gorilla
spring.config.import=optional:file:.env[.properties]

# Azure AI Foundry agent configuration
azure.ai.foundry.project-endpoint=${AZURE_EXISTING_AIPROJECT_ENDPOINT:}
azure.ai.foundry.agent-id=${AZURE_EXISTING_AGENT_ID:}

# Azure Speech TTS configuration
azure.ai.speech.endpoint=${AZURE_SPEECH_ENDPOINT:}
azure.ai.speech.key=${AZURE_SPEECH_KEY:}
azure.ai.speech.region=${AZURE_LOCATION:}
azure.ai.speech.voice-name=${AZURE_SPEECH_VOICE_NAME:th-TH-PremwadeeNeural}
azure.ai.speech.output-format=${AZURE_SPEECH_OUTPUT_FORMAT:audio-24khz-48kbitrate-mono-mp3}

# Admin session authentication
app.security.admin-username=${ADMIN_USERNAME:}
app.security.admin-password=${ADMIN_PASSWORD:}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Session behavior
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
